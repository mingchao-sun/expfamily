title: 'Factorial Design'
name: exfact
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Factor A (treatment 1)'
            children:
                - type: VariablesListBox
                  name: factorA
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Factor B (treatment 2)'
            children:
                - type: VariablesListBox
                  name: factorB
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Covariates (baseline)'
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: 'Block (randomization strata)'
            children:
                - type: VariablesListBox
                  name: block
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Cluster'
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: 'Estimation'
      collapsed: false
      children:
          - type: TextBox
            name: controlA
            label: 'Control level of A'
            format: string
          - type: TextBox
            name: controlB
            label: 'Control level of B'
            format: string
          - type: ComboBox
            name: se
          - type: TextBox
            name: level
            label: 'Confidence level (%)'
            format: number
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
