---
name: exri
title: 'Randomization Inference'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Randomization Inference'
menuSubtitle: 'Exact and simulated p-values under the sharp null'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: block
      title: 'Block (randomization strata)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: cluster
      title: 'Cluster'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: stat
      title: 'Test statistic'
      type: List
      options:
          - name: diff
            title: 'Difference in means'
          - name: rank
            title: 'Difference in mean ranks'
          - name: tstat
            title: 'Studentised difference (Welch t)'
      default: diff

    - name: tau
      title: 'Hypothesised constant effect'
      type: Number
      default: 0

    - name: sims
      title: 'Number of simulated randomizations'
      type: Integer
      default: 5000
      min: 100
      max: 500000

    - name: exactMax
      title: 'Enumerate all randomizations up to'
      type: Integer
      default: 20000
      min: 100
      max: 2000000

    - name: seed
      title: 'Random seed'
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: ci
      title: 'Confidence interval for a constant effect'
      type: Bool
      default: true

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: plot
      title: 'Distribution plot'
      type: Bool
      default: true

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
