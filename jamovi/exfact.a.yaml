---
name: exfact
title: 'Factorial Design'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Factorial Design'
menuSubtitle: 'Two crossed treatments: main effects, simple effects, interaction'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: factorA
      title: 'Factor A (treatment 1)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: controlA
      title: 'Control level of A (blank = the first)'
      type: String
      default: ''

    - name: factorB
      title: 'Factor B (treatment 2)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: controlB
      title: 'Control level of B (blank = the first)'
      type: String
      default: ''

    - name: covs
      title: 'Covariates (baseline)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: block
      title: 'Block (randomization strata)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: cluster
      title: 'Cluster'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: se
      title: 'Standard errors'
      type: List
      options:
          - name: auto
            title: 'Automatic: HC2, or CR1 with clusters'
          - name: classical
            title: 'Classical'
          - name: hc1
            title: 'Robust HC1'
          - name: hc2
            title: 'Robust HC2'
          - name: hc3
            title: 'Robust HC3'
          - name: cr1
            title: 'Cluster CR1'
      default: auto

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
