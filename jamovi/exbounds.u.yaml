title: 'Worst-Case Bounds'
name: exbounds
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Treatment (arms)'
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: 'Situation and range of the outcome'
      collapsed: false
      children:
          - type: ComboBox
            name: mode
          - type: TextBox
            name: ymin
            label: 'Lowest possible outcome'
            format: string
          - type: TextBox
            name: ymax
            label: 'Highest possible outcome'
            format: string
    - type: CollapseBox
      label: 'Estimation'
      collapsed: true
      children:
          - type: TextBox
            name: control
            label: 'Control group value'
            format: string
          - type: TextBox
            name: armTreat
            label: 'Treatment group value'
            format: string
          - type: TextBox
            name: level
            label: 'Confidence level (%)'
            format: number
          - type: TextBox
            name: nboot
            label: 'Bootstrap samples'
            format: number
          - type: TextBox
            name: seed
            label: 'Random seed'
            format: number
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
