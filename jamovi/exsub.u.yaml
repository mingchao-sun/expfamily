title: 'Subgroup Effects'
name: exsub
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Treatment (arms)'
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Subgroup variables (categorical)'
            children:
                - type: VariablesListBox
                  name: subgroups
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: 'Covariates (baseline)'
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: 'Block (randomization strata)'
            children:
                - type: VariablesListBox
                  name: block
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Cluster'
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: 'Estimation'
      collapsed: false
      children:
          - type: TextBox
            name: control
            label: 'Control group value'
            format: string
          - type: TextBox
            name: armTreat
            label: 'Treatment group value'
            format: string
          - type: ComboBox
            name: method
          - type: ComboBox
            name: se
          - type: ComboBox
            name: adjust
          - type: TextBox
            name: level
            label: 'Confidence level (%)'
            format: number
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
