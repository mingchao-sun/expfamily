---
name: exeffect
title: 'Treatment Effects'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Treatment Effects'
menuSubtitle: 'Difference in means, covariate adjustment, blocks and clusters'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: covs
      title: 'Covariates (baseline)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: block
      title: 'Block (randomization strata)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: cluster
      title: 'Cluster'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: method
      title: 'Estimator'
      type: List
      options:
          - name: diff
            title: 'Difference in means'
          - name: adjust
            title: 'Covariates added (regression adjustment)'
          - name: lin
            title: 'Covariates interacted with the arms (Lin)'
      default: diff

    - name: se
      title: 'Standard errors'
      type: List
      options:
          - name: auto
            title: 'Automatic: HC2, or CR2 with clusters'
          - name: classical
            title: 'Classical'
          - name: hc1
            title: 'Robust HC1 (as Stata robust)'
          - name: hc2
            title: 'Robust HC2'
          - name: hc3
            title: 'Robust HC3'
          - name: cr1
            title: 'Cluster CR1 (as Stata cluster)'
          - name: cr2
            title: 'Cluster CR2 (Bell-McCaffrey)'
      default: auto

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
