---
name: exmht
title: 'Multiple Outcomes'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Multiple Outcomes'
menuSubtitle: 'Adjusted p-values for several outcomes'

options:
    - name: data
      type: Data

    - name: outcomes
      title: 'Outcomes'
      type: Variables
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: armTreat
      title: 'Treatment group value (blank = the second)'
      type: String
      default: ''

    - name: covs
      title: 'Covariates (baseline)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: block
      title: 'Block (randomization strata)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: bonf
      title: 'Bonferroni'
      type: Bool
      default: true

    - name: sidak
      title: 'Sidak'
      type: Bool
      default: false

    - name: holm
      title: 'Holm'
      type: Bool
      default: true

    - name: hochberg
      title: 'Hochberg'
      type: Bool
      default: false

    - name: bh
      title: 'Benjamini-Hochberg (false discovery rate)'
      type: Bool
      default: true

    - name: by
      title: 'Benjamini-Yekutieli (false discovery rate)'
      type: Bool
      default: false

    - name: wymin
      title: 'Westfall-Young step-down (min-p)'
      type: Bool
      default: true

    - name: wymax
      title: 'Westfall-Young step-down (max-t)'
      type: Bool
      default: false

    - name: rw
      title: 'Romano-Wolf step-down (bootstrap)'
      type: Bool
      default: true

    - name: nperm
      title: 'Permutations (Westfall-Young)'
      type: Integer
      default: 2000
      min: 100
      max: 100000

    - name: nboot
      title: 'Bootstrap samples (Romano-Wolf)'
      type: Integer
      default: 1000
      min: 100
      max: 50000

    - name: seed
      title: 'Random seed'
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: alpha
      title: 'Significance level for the flags'
      type: Number
      default: 0.05
      min: 0.001
      max: 0.5

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
