title: 'Bounds under Attrition'
name: exlee
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome (missing = not observed)'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Treatment (arms)'
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Covariates to tighten the bounds'
            children:
                - type: VariablesListBox
                  name: tight
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: 'Estimation'
      collapsed: false
      children:
          - type: TextBox
            name: control
            label: 'Control group value'
            format: string
          - type: TextBox
            name: armTreat
            label: 'Treatment group value'
            format: string
          - type: ComboBox
            name: direction
          - type: TextBox
            name: level
            label: 'Confidence level (%)'
            format: number
          - type: TextBox
            name: nboot
            label: 'Bootstrap samples'
            format: number
          - type: TextBox
            name: seed
            label: 'Random seed'
            format: number
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
