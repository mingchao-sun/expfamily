---
name: expower
title: 'Power and Sample Size'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Power and Sample Size'
menuSubtitle: 'Power, minimum detectable effect and sample size'

options:
    - name: data
      type: Data

    - name: mode
      title: 'Calculate'
      type: List
      options:
          - name: power
            title: 'Power'
          - name: mde
            title: 'Minimum detectable effect'
          - name: n
            title: 'Sample size'
      default: power

    - name: design
      title: 'Design'
      type: List
      options:
          - name: indiv
            title: 'Individual randomization'
          - name: cluster
            title: 'Cluster randomization'
      default: indiv

    - name: sd
      title: 'Standard deviation of the outcome'
      type: Number
      default: 1
      min: 1e-07

    - name: effect
      title: 'Effect to detect (outcome units)'
      type: Number
      default: 0.3

    - name: alpha
      title: 'Significance level'
      type: Number
      default: 0.05
      min: 0.0001
      max: 0.5

    - name: target
      title: 'Target power'
      type: Number
      default: 0.8
      min: 0.5
      max: 0.9999

    - name: sided
      title: 'Test'
      type: List
      options:
          - name: two
            title: 'Two-sided'
          - name: one
            title: 'One-sided'
      default: two

    - name: share
      title: 'Share assigned to treatment'
      type: Number
      default: 0.5
      min: 0.01
      max: 0.99

    - name: ntotal
      title: 'Total number of units (individual design)'
      type: Integer
      default: 200
      min: 6

    - name: r2
      title: 'Share of variance explained by covariates (R2)'
      type: Number
      default: 0
      min: 0
      max: 0.99

    - name: ncov
      title: 'Number of covariates'
      type: Integer
      default: 0
      min: 0
      max: 200

    - name: clusters
      title: 'Total number of clusters'
      type: Integer
      default: 40
      min: 6

    - name: msize
      title: 'Units per cluster'
      type: Number
      default: 25
      min: 1

    - name: rho
      title: 'Intracluster correlation'
      type: Number
      default: 0.05
      min: 0
      max: 0.99

    - name: cv
      title: 'Coefficient of variation of the cluster sizes'
      type: Number
      default: 0
      min: 0
      max: 5

    - name: dataOutcome
      title: 'Outcome (to take the standard deviation and correlation from)'
      type: Variable
      permitted:
          - numeric

    - name: dataCluster
      title: 'Cluster (to take the correlation from)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: dataCovs
      title: 'Covariates (to take R2 from)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: useData
      title: 'Take standard deviation, correlation and R2 from the data'
      type: Bool
      default: false

    - name: plot
      title: 'Power curve'
      type: Bool
      default: true

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
