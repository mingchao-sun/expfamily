---
name: exbalance
title: 'Balance and Attrition'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Balance and Attrition'
menuSubtitle: 'Baseline balance, joint test and attrition'

options:
    - name: data
      type: Data

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: covs
      title: 'Covariates (baseline)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: block
      title: 'Block (randomization strata)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: outcome
      title: 'Outcome (for attrition)'
      type: Variable
      permitted:
          - numeric

    - name: nperm
      title: 'Permutations for the joint test'
      type: Integer
      default: 2000
      min: 100
      max: 100000

    - name: seed
      title: 'Random seed'
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: flag
      title: 'Flag standardised differences above'
      type: Number
      default: 0.1
      min: 0.01
      max: 2

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
