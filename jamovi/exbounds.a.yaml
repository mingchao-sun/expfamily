---
name: exbounds
title: 'Worst-Case Bounds'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Worst-Case Bounds'
menuSubtitle: 'Manski bounds on the average effect without or with weak assumptions'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: armTreat
      title: 'Treatment group value (blank = the second)'
      type: String
      default: ''

    - name: mode
      title: 'Situation'
      type: List
      options:
          - name: random
            title: 'Treatment assigned at random; some outcomes are missing'
          - name: selection
            title: 'Treatment not random (units chose it); all outcomes observed'
      default: random

    - name: ymin
      title: 'Lowest possible outcome (blank = lowest observed)'
      type: String
      default: ''

    - name: ymax
      title: 'Highest possible outcome (blank = highest observed)'
      type: String
      default: ''

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: nboot
      title: 'Bootstrap samples'
      type: Integer
      default: 1000
      min: 100
      max: 50000

    - name: seed
      title: 'Random seed'
      type: Integer
      default: 1234
      min: 1
      max: 999999

    - name: plot
      title: 'Bounds plot'
      type: Bool
      default: true

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
