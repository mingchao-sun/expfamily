---
name: exsub
title: 'Subgroup Effects'
jas: '1.2'
version: '1.0.0'
menuGroup: Experiments
menuTitle: 'Subgroup Effects'
menuSubtitle: 'Treatment effects by subgroup, interaction tests, adjusted p-values'

options:
    - name: data
      type: Data

    - name: outcome
      title: 'Outcome'
      type: Variable
      permitted:
          - numeric

    - name: treat
      title: 'Treatment (arms)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: control
      title: 'Control group value (blank = the first)'
      type: String
      default: ''

    - name: armTreat
      title: 'Treatment group value (blank = the second)'
      type: String
      default: ''

    - name: subgroups
      title: 'Subgroup variables (categorical)'
      type: Variables
      suggested:
          - nominal
      permitted:
          - factor
          - id
          - numeric

    - name: covs
      title: 'Covariates (baseline)'
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: block
      title: 'Block (randomization strata)'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: cluster
      title: 'Cluster'
      type: Variable
      suggested:
          - nominal
      permitted:
          - numeric
          - factor
          - id

    - name: method
      title: 'Estimator in each subgroup'
      type: List
      options:
          - name: diff
            title: 'Difference in means'
          - name: adjust
            title: 'Covariates and blocks added'
      default: diff

    - name: se
      title: 'Standard errors'
      type: List
      options:
          - name: auto
            title: 'Automatic: HC2, or CR1 with clusters'
          - name: classical
            title: 'Classical'
          - name: hc1
            title: 'Robust HC1'
          - name: hc2
            title: 'Robust HC2'
          - name: hc3
            title: 'Robust HC3'
          - name: cr1
            title: 'Cluster CR1'
      default: auto

    - name: adjust
      title: 'Adjust p-values for the number of subgroups'
      type: List
      options:
          - name: holm
            title: 'Holm'
          - name: bonferroni
            title: 'Bonferroni'
          - name: bh
            title: 'Benjamini-Hochberg'
          - name: none
            title: 'None'
      default: holm

    - name: level
      title: 'Confidence level (%)'
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: plot
      title: 'Forest plot'
      type: Bool
      default: true

    - name: showHelp
      title: 'Method notes'
      type: Bool
      default: false

    - name: showGuide
      title: 'Data and setup guide'
      type: Bool
      default: false

...
