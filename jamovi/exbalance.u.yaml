title: 'Balance and Attrition'
name: exbalance
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Treatment (arms)'
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Covariates (baseline)'
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: 'Block (randomization strata)'
            children:
                - type: VariablesListBox
                  name: block
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Outcome (for attrition)'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: 'Estimation'
      collapsed: false
      children:
          - type: TextBox
            name: control
            label: 'Control group value'
            format: string
          - type: TextBox
            name: nperm
            label: 'Permutations for the joint test'
            format: number
          - type: TextBox
            name: seed
            label: 'Random seed'
            format: number
          - type: TextBox
            name: flag
            label: 'Flag standardised differences above'
            format: number
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
