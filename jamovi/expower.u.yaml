title: 'Power and Sample Size'
name: expower
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome (for the standard deviation)'
            children:
                - type: VariablesListBox
                  name: dataOutcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Cluster (for the correlation)'
            children:
                - type: VariablesListBox
                  name: dataCluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Covariates (for R2)'
            children:
                - type: VariablesListBox
                  name: dataCovs
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: 'Design'
      collapsed: false
      children:
          - type: ComboBox
            name: mode
          - type: ComboBox
            name: design
          - type: TextBox
            name: sd
            label: 'Standard deviation of the outcome'
            format: number
          - type: TextBox
            name: effect
            label: 'Effect to detect (outcome units)'
            format: number
          - type: TextBox
            name: alpha
            label: 'Significance level'
            format: number
          - type: TextBox
            name: target
            label: 'Target power'
            format: number
          - type: ComboBox
            name: sided
          - type: TextBox
            name: share
            label: 'Share assigned to treatment'
            format: number
          - type: TextBox
            name: ntotal
            label: 'Total number of units (individual design)'
            format: number
          - type: TextBox
            name: r2
            label: 'Share of variance explained by covariates (R2)'
            format: number
          - type: TextBox
            name: ncov
            label: 'Number of covariates'
            format: number
    - type: CollapseBox
      label: 'Cluster randomization'
      collapsed: true
      children:
          - type: TextBox
            name: clusters
            label: 'Total number of clusters'
            format: number
          - type: TextBox
            name: msize
            label: 'Units per cluster'
            format: number
          - type: TextBox
            name: rho
            label: 'Intracluster correlation'
            format: number
          - type: TextBox
            name: cv
            label: 'Coefficient of variation of the cluster sizes'
            format: number
    - type: CollapseBox
      label: 'Plot and data'
      collapsed: true
      children:
          - type: CheckBox
            name: useData
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
