title: 'Multiple Outcomes'
name: exmht
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcomes'
            children:
                - type: VariablesListBox
                  name: outcomes
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: 'Treatment (arms)'
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Covariates (baseline)'
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: 'Block (randomization strata)'
            children:
                - type: VariablesListBox
                  name: block
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: 'Adjustment methods'
      collapsed: false
      children:
          - type: CheckBox
            name: bonf
          - type: CheckBox
            name: sidak
          - type: CheckBox
            name: holm
          - type: CheckBox
            name: hochberg
          - type: CheckBox
            name: bh
          - type: CheckBox
            name: by
          - type: CheckBox
            name: wymin
          - type: CheckBox
            name: wymax
          - type: CheckBox
            name: rw
    - type: CollapseBox
      label: 'Estimation'
      collapsed: true
      children:
          - type: TextBox
            name: control
            label: 'Control group value'
            format: string
          - type: TextBox
            name: armTreat
            label: 'Treatment group value'
            format: string
          - type: TextBox
            name: nperm
            label: 'Permutations (Westfall-Young)'
            format: number
          - type: TextBox
            name: nboot
            label: 'Bootstrap samples (Romano-Wolf)'
            format: number
          - type: TextBox
            name: seed
            label: 'Random seed'
            format: number
          - type: TextBox
            name: alpha
            label: 'Significance level for the flags'
            format: number
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
