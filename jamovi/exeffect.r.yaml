---
name: exeffect
title: 'Treatment Effects'
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: desc
      title: 'Outcome by group'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control]
      columns:
        - name: arm
          title: 'Group'
          type: text
        - name: n
          title: 'N'
          type: integer
        - name: mean
          title: 'Mean'
          type: number
        - name: sd
          title: 'Std. deviation'
          type: number

    - name: est
      title: 'Effect of each treatment against the control'
      type: Table
      rows: 0
      clearWith: [outcome, treat, control, covs, block, cluster, method, se, level]
      columns:
        - name: arm
          title: 'Treatment'
          type: text
        - name: estimate
          title: 'Effect'
          type: number
        - name: se
          title: 'Std. error'
          type: number
        - name: t
          title: 't'
          type: number
        - name: df
          title: 'df'
          type: number
        - name: p
          title: 'p'
          type: number
          format: zto,pvalue
        - name: lo
          title: 'CI lower'
          type: number
        - name: hi
          title: 'CI upper'
          type: number
        - name: std
          title: 'Effect in control SDs'
          type: number

refs:
    - lin2013
    - bellmccaffrey2002
    - pustejovskytipton2018
    - estimatr

