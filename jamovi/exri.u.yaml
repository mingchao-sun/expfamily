title: 'Randomization Inference'
name: exri
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: 'Outcome'
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Treatment (arms)'
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Block (randomization strata)'
            children:
                - type: VariablesListBox
                  name: block
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: 'Cluster'
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: 'Estimation'
      collapsed: false
      children:
          - type: TextBox
            name: control
            label: 'Control group value'
            format: string
          - type: ComboBox
            name: stat
          - type: TextBox
            name: tau
            label: 'Hypothesised constant effect'
            format: number
          - type: TextBox
            name: sims
            label: 'Number of simulated randomizations'
            format: number
          - type: TextBox
            name: exactMax
            label: 'Enumerate all randomizations up to'
            format: number
          - type: TextBox
            name: seed
            label: 'Random seed'
            format: number
          - type: CheckBox
            name: ci
          - type: TextBox
            name: level
            label: 'Confidence level (%)'
            format: number
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: 'Output'
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
